name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (Boot baseline)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is derived from the nearest release tag; a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build
        run: ./gradlew build --stacktrace

      # The Java modules' ABI against the last release (the Kotlin ones are `checkKotlinAbi`, in `build`).
      # Moves to each new version on release; RELEASING.md says when.
      - name: Check binary compatibility with the last release
        run: ./gradlew apiCompatibility -PapiBaseline=0.3.0 --stacktrace

      # The release notes are generated by this task (RELEASING.md). It runs on the build classpath's
      # Jackson and JGit, so a plugin bump can break it without touching a test; caught here rather
      # than on release day. The workflow's own ephemeral token is all it needs to read.
      - name: Generate the changelog
        run: ./gradlew jreleaserChangelog
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The generated model is committed, so CI only has to prove that regenerating it
      # produces no diff. A failure here means someone edited generated sources by hand, or changed
      # the generator without regenerating.
      - name: Check the generated model, Kotlin DSL and kotlinx binding are up to date
        run: |
          # Three emitters, three committed trees. Leaving one out of this list is the failure the
          # check exists to prevent, one level up. Listed as an array rather than one string so the
          # paths cannot depend on the shell's word splitting.
          generated=(
            teams4j-cards/src/generated
            teams4j-cards-kotlin/src/generated
            teams4j-cards-kotlinx/src/generated
          )
          ./gradlew :codegen:generateModel
          git diff --exit-code -- "${generated[@]}"
          # git diff alone would pass over a newly generated, still-untracked file
          test -z "$(git status --porcelain -- "${generated[@]}")" \
            || {
              echo 'generated sources changed:'
              git status --short -- "${generated[@]}"
              exit 1
            }

  starter-boot-matrix:
    # One starter artifact covers every supported Boot line; a failure here is the signal to split it.
    name: starters on Spring Boot ${{ matrix.boot }}.x
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: ['3', '4']
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is derived from the nearest release tag; a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test the starters against Boot ${{ matrix.boot }}.x
        env:
          BOOT_LINE: ${{ matrix.boot }}
        run: >
          ./gradlew :teams4j-webhook-spring-boot-starter:test :teams4j-bot-spring-boot-starter:test
          -PbootLine="$BOOT_LINE"

  jackson-latest:
    # The POMs name the Jackson baseline; this proves the newest 2.x still works.
    name: tests on the newest Jackson 2.x
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is derived from the nearest release tag; a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test against the newest Jackson 2.x
        run: ./gradlew test -PjacksonLine=latest

  jdk-latest:
    # Tests run on the toolchain (21); this runs them on the newest LTS too.
    name: tests on JDK 25
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is derived from the nearest release tag; a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Point Gradle at JDK 25
        run: echo 'org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64' >> ~/.gradle/gradle.properties

      - name: Test on JDK 25
        run: ./gradlew test -PtestJdk=25

  ktor-latest:
    # The POM names the Ktor baseline; this proves the newest 3.x still works.
    name: bot-ktor on the newest Ktor 3.x
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is derived from the nearest release tag; a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test against the newest Ktor 3.x
        run: ./gradlew :teams4j-bot-ktor:test -PktorLine=latest

  examples:
    # The examples are a separate build that resolves teams4j from a repository, so this is the
    # only place that checks the published artifacts as a stranger sees them: POMs, dependency
    # scopes, the BOM's module list, and the ServiceLoader registrations that pick a JSON binding.
    # The cookbook's snippets were verified by hand once and the harness was lost; this is that
    # check made permanent.
    name: examples
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is derived from the nearest release tag; a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false

      # 17 runs the examples (their toolchain); 21, the default, builds the library.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Gradle finds a toolchain only where it is told to look.
      - name: Point Gradle at JDK 17
        run: echo 'org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64' >> ~/.gradle/gradle.properties

      - name: Publish the artifacts the examples resolve
        run: ./gradlew publishToMavenLocal

      # The examples pin teams4jVersion for a reader; CI overrides it with whatever was just
      # published, so this job follows the tag-derived version without a file to keep in step.
      - name: Read the published version
        run: echo "TEAMS4J_VERSION=$(./gradlew -q printVersion)" >> "$GITHUB_ENV"

      - name: Build the examples
        working-directory: ./examples
        run: ./gradlew build --stacktrace -Pteams4jVersion="$TEAMS4J_VERSION"

      # The starter examples have to start on each supported Boot line, not merely compile. The Boot 4
      # version is the catalog's, so Dependabot moves this too.
      - name: Build the Spring examples against Boot 4.x
        working-directory: ./examples
        run: |
          boot4=$(sed -n 's/^springBoot4 = "\(.*\)"$/\1/p' ../gradle/libs.versions.toml)
          test -n "$boot4"
          ./gradlew :spring-boot:build :bot-spring-boot:build -PbootVersion="$boot4" -Pteams4jVersion="$TEAMS4J_VERSION"

      # The compatibility page claims Kotlin baseline+; this is that claim checked with the
      # baseline compiler.
      - name: Build the Kotlin examples on the Kotlin baseline
        working-directory: ./examples
        run: |
          baseline=$(sed -n 's/^kotlinBaseline = "\(.*\)"$/\1/p' ../gradle/libs.versions.toml)
          test -n "$baseline"
          ./gradlew :kotlin-coroutines:build :bot-ktor:build -PkotlinVersion="$baseline" -Pteams4jVersion="$TEAMS4J_VERSION"

  docs:
    # The site includes source files by path and #region; a rename in the tree fails this build.
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: node

      # The guides write `$version`, never a release number, so a release edits none of them.
      - name: No release numbers in the guides
        run: |
          ! grep -rnE 'io\.github\.teams4j:[a-z0-9-]+:[0-9]|<version>[0-9]' README.md docs/index.md docs/guide docs/cookbook docs/reference

      - name: Build the docs site
        working-directory: docs
        run: |
          npm ci
          npm run build
