name: Dependency graph submit

# Submits the graph a pull request generated. Runs in the default branch's context and checks out
# nothing: the pull request's code never runs with this token. Same-repository runs only: a fork
# edits the producer's own guard.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] only downloads the uploaded graph; no checkout, no build
    workflows: [Dependency submission]
    types: [completed]

permissions: {}

jobs:
  submit:
    name: submit the pull request's dependency graph
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Download and submit the dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: download-and-submit
