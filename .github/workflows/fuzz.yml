name: Fuzz

# Fuzzing mode for the Jazzer tests in teams4j-fuzz; CI's `build` already runs them in regression
# mode, over the committed inputs. Each run starts from the seed corpus, not from the last run's.

on:
  schedule:
    - cron: '0 18 * * *' # daily, 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - BotEndpointFuzzTest.body
          - BotEndpointFuzzTest.authorizationHeader
          - JsonCodecAgreementFuzzTest.read
          - CardBindingAgreementFuzzTest.read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is derived from the nearest release tag; a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: ./gradlew :teams4j-fuzz:fuzz --tests "io.github.teams4j.fuzz.$TARGET" -PfuzzDuration=5m

      # Jazzer writes a finding next to the committed inputs; committing it, renamed, is the
      # regression test. Retention is short: in a public repository an artifact is a working repro.
      - name: Upload the finding
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-finding-${{ matrix.target }}
          path: |
            teams4j-fuzz/src/test/resources/**/crash-*
            teams4j-fuzz/src/test/resources/**/timeout-*
            teams4j-fuzz/build/reports/tests/fuzz/
          if-no-files-found: ignore
          retention-days: 7
