version: 2
updates:
  - package-ecosystem: gradle
    directories:
      - /
      - /examples
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The catalog pins a Boot 3 baseline and a Boot 4 line on purpose; each moves within its major.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      # Jackson and Ktor are lower bounds the POMs name (a consumer's own version wins); the newest
      # line is covered by the -PjacksonLine=latest / -PktorLine=latest CI jobs, not by bumping these.
      - dependency-name: "com.fasterxml.jackson*"
      - dependency-name: "io.ktor:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
