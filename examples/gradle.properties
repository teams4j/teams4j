org.gradle.jvmargs=-Xmx1g

# The version under test. Until 0.1.0 is on Central it is a SNAPSHOT, so run
# `./gradlew publishToMavenLocal` in the parent directory first; `./gradlew printVersion` there
# prints the version it published, and `-Pteams4jVersion=...` overrides this value (CI does that).
teams4jVersion=0.1.0-SNAPSHOT

# Boot version for :spring-boot. Override to check the other Boot line:
#   ./gradlew :spring-boot:run -PbootVersion=4.1.1
bootVersion=3.5.16
