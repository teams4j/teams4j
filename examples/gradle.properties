org.gradle.jvmargs=-Xmx1g

# The released version, resolved from Central. To run the examples against the tree you are
# editing: `./gradlew publishToMavenLocal` in the parent directory, then pass what its
# `./gradlew printVersion` printed as `-Pteams4jVersion=...` (CI does exactly that).
teams4jVersion=0.1.0

# Boot version for :spring-boot. Override to check the other Boot line:
#   ./gradlew :spring-boot:run -PbootVersion=4.1.1
bootVersion=3.5.16

# Kotlin for :kotlin-coroutines. CI also builds it on the supported minimum:
#   ./gradlew :kotlin-coroutines:build -PkotlinVersion=2.2.21
kotlinVersion=2.4.10

# Ktor for :bot-ktor. teams4j-bot-ktor names 3.0 as its lower bound; the example runs on a current 3.x.
ktorVersion=3.5.2
