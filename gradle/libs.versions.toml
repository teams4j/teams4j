[versions]
# Java baseline 17: toolchain 21, bytecode targeting 17.
javaRelease = "17"
javaToolchain = "21"

# Lowest supported Jackson, and the only version the POMs name; a consumer's own wins. The newest
# 2.x is tested with -PjacksonLine=latest (teams4j.java-conventions).
jackson = "2.18.12"
# Lowest supported Jackson 3, the only version teams4j-cards-jackson3's POM names: 3.0.x gets no
# security fixes. Tested on the newest 3.x with -PjacksonLine=latest.
jackson3 = "3.1.8"
javapoet = "0.22.0"
jspecify = "1.0.1"
kotlin = "2.4.21"
# Lowest supported Kotlin; the modules compile at this language version and stdlib. Read by CI;
# the convention plugin repeats the literal.
kotlinBaseline = "2.3.21"
# Lower bounds the kotlinx POMs name; a consumer's own wins. Each must stay within kotlinBaseline's
# stdlib.
kotlinx-serialization = "1.13.0"
kotlinx-coroutines = "1.11.0"
junit = "6.1.3"
assertj = "3.27.7"
wiremock = "4.0.0-beta.44"
# teams4j-fuzz only; never on a published classpath.
jazzer = "0.30.0"
# teams4j-fuzz only: decides which inputs are valid cards. 3.x is on Jackson 3, whose packages leave the
# Jackson 2 under test alone.
jsonSchemaValidator = "3.0.9"
# Compile baselines of the -boot3 and -boot4 starters; a consumer's Boot BOM raises them. Dependabot
# keeps each line within its major (see .github/dependabot.yml).
springBoot = "3.5.16"
springBoot4 = "4.1.1"
# Lowest supported Ktor, the only version the POM names; a consumer's own wins. The newest 3.x is
# tested with -PktorLine=latest (teams4j-bot-ktor).
ktor = "3.0.3"
# Compile-only in teams4j-logback, so no POM names it: the application's own Logback is the one used.
logback = "1.5.38"
# Compile-only in teams4j-log4j2, as Logback is above.
log4j = "2.26.1"
spotless = "8.11.0"
# Release only: uploads the locally staged repository to the Central Portal. It does not sign
# -- Gradle's signing plugin does, and exactly one of the two may be active. It stays in the root
# `plugins {}` block: on the buildSrc classpath its JGit collides with Spotless's (7.x dropped
# GpgObjectSigner).
jreleaser = "1.27.0"
# Build classpath only (buildSrc/build.gradle.kts), unrelated to the library's Jackson baseline
# above: the Jackson every root plugin runs on. Must be JReleaser's Jackson line or newer.
jacksonBuild = "2.23.0"
# The version comes from the nearest `v*` tag (see the root build), so no file in the tree carries
# it and a release is a tag rather than a commit. Read-only: it never tags or pushes.
gitVersion = "5.2.0"
# Nullness enforcement. NullAway runs as an Error Prone plugin, so the three move together.
errorprone = "2.52.0"
errorpronePlugin = "5.1.1"
nullaway = "0.14.3"

# Kotlin static analysis, the counterpart to Error Prone + NullAway on the Java side. ktlint is
# formatting and runs through Spotless; detekt is the analyser and has a task of its own.
# detekt 2.0 is still alpha, but 1.23.8 embeds Kotlin 2.0.21 and cannot read a stdlib newer than 2.2,
# which mis-resolves every suspend call. Build-time only: nothing of it reaches a consumer.
ktlint = "1.8.0"
# Pinned so a Spotless upgrade cannot reformat the Java tree on its own.
palantirJavaFormat = "2.103.0"
detekt = "2.0.0-alpha.6"
# API docs for the Kotlin modules; the Java modules use javadoc. Its HTML fills their javadoc jar.
dokka = "2.3.0"

# Binary-compatibility gate for the Java modules, which the Kotlin plugin's ABI validation does not
# cover.
japicmp = "0.4.6"

[libraries]
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }

# The nullness contract. A 3.8KB annotations-only jar, applied compileOnly so it never reaches a
# consumer's runtime classpath -- the JVM ignores annotations whose type it cannot resolve.
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

# codegen only: the Palantir fork, which can emit records, sealed types and permits clauses.
javapoet = { module = "com.palantir.javapoet:javapoet", version.ref = "javapoet" }

spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
# The Boot 4 BOM, for the -boot4 starters.
spring-boot4-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot4" }
# The starters' compile dependency, per Boot line. Pinned as a POM lower bound, so no BOM import is exported.
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot" }
spring-boot4-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot4" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# The bot starter's endpoint is a Spring MVC controller. Compile-only there: an application without
# MVC still gets the beans, just no endpoint. Versions from the Boot BOM under test.
spring-web = { module = "org.springframework:spring-web" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }

# Pinned as a POM lower bound, as jackson-databind is; no BOM is exported. -PktorLine=latest puts
# the newest ktor-bom on the test classpath instead (teams4j-bot-ktor).
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }

errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

# For the convention plugin classpath in buildSrc.
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-gradle = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorpronePlugin" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradle = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
dokka-gradle = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
japicmp-gradle = { module = "me.champeau.gradle:japicmp-gradle-plugin", version.ref = "japicmp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# Unused: Spotless takes these as versions. Listed so Dependabot tracks them.
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }
palantir-java-format = { module = "com.palantir.javaformat:palantir-java-format", version.ref = "palantirJavaFormat" }

[plugins]
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
git-version = { id = "com.palantir.git-version", version.ref = "gitVersion" }
