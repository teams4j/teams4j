[versions]
# Java baseline 17: toolchain 21, bytecode targeting 17.
javaRelease = "17"
javaToolchain = "21"

jackson = "2.22.2"
javapoet = "0.19.0"
jspecify = "1.0.1"
kotlin = "2.4.10"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
junit = "6.1.3"
assertj = "3.27.7"
wiremock = "3.13.2"
# Boot compile baseline: the lowest supported version. A consumer's Boot BOM raises it.
springBoot = "3.5.16"
# The newer line; the starter's tests run against it with -PbootLine=4. Dependabot keeps each line
# within its major (see .github/dependabot.yml).
springBoot4 = "4.1.1"
spotless = "8.10.1"
# Release only: uploads the locally staged repository to the Central Portal. It does not sign
# -- Gradle's signing plugin does, and exactly one of the two may be active.
jreleaser = "1.25.0"
# The version comes from the nearest `v*` tag (see the root build), so no file in the tree carries
# it and a release is a tag rather than a commit. Read-only: it never tags or pushes.
gitVersion = "5.1.0"
# Nullness enforcement. NullAway runs as an Error Prone plugin, so the three move together.
errorprone = "2.50.0"
errorpronePlugin = "5.1.1"
nullaway = "0.14.0"

# Kotlin static analysis, the counterpart to Error Prone + NullAway on the Java side. ktlint is
# formatting and runs through Spotless; detekt is the analyser and has a task of its own.
ktlint = "1.6.0"
detekt = "1.23.8"

# Public-ABI gate. Dumps the API to committed .api files, so a change to what consumers can
# see arrives as a reviewable diff instead of being noticed after release.
binaryCompatibilityValidator = "0.18.1"

# Binary-compatibility gate for the Java modules, which binary-compatibility-validator does not
# cover -- it registers tasks only where the Kotlin plugin is applied.
japicmp = "0.4.6"

[libraries]
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }

# The nullness contract. A 3.8KB annotations-only jar, applied compileOnly so it never reaches a
# consumer's runtime classpath -- the JVM ignores annotations whose type it cannot resolve.
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

# codegen only: the Palantir fork, which can emit records, sealed types and permits clauses.
javapoet = { module = "com.palantir.javapoet:javapoet", version.ref = "javapoet" }

spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
# Test-only: the Boot 4 BOM. Listed here so Dependabot tracks the 4.x line too.
spring-boot4-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot4" }
# The starter's compile dependency. The version is pinned as a POM lower bound, so no BOM import is exported.
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }

errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

# For the convention plugin classpath in buildSrc.
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-gradle = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorpronePlugin" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradle = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
japicmp-gradle = { module = "me.champeau.gradle:japicmp-gradle-plugin", version.ref = "japicmp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

[plugins]
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
git-version = { id = "com.palantir.git-version", version.ref = "gitVersion" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
